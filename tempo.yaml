# Local Tempo config (managed by `cgs otel-up`). Monolithic single binary with
# local filesystem storage under ./dev.observability/. OTLP receiver ports are
# remapped (4320/4321) because the collector owns the standard 4317/4318.
# Query UI is served by Grafana (Tempo datasource, provisioned).

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 127.0.0.1:4320
        http:
          endpoint: 127.0.0.1:4321

storage:
  trace:
    backend: local
    local:
      path: dev.observability/tempo-data
    wal:
      path: dev.observability/tempo-wal
