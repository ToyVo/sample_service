# Local Prometheus config (managed by `cgs otel-up`). Scrapes the collector's
# Prometheus exporter (app metrics arrive via OTLP) plus itself.
# UI: http://localhost:9090

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otelcol
    static_configs:
      - targets: ["127.0.0.1:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
