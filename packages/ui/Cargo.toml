[dependencies]
api = {workspace = true}
dioxus = {workspace = true}
dioxus-icons = {workspace = true}
dioxus-primitives = {features = ["router"], workspace = true}
reqwest = {default-features = false, workspace = true}
serde = {features = ["derive"], workspace = true}
serde_json = {workspace = true}

[features]
server = ["api/server", "dioxus/fullstack"]

[lints]
workspace = true

[package]
edition = "2024"
name = "ui"
version = "0.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = {features = ["Location", "Window"], version = "0.3"}
