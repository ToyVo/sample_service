[dependencies]
argon2 = {features = ["std"], optional = true, workspace = true}
async-trait = {optional = true, workspace = true}
axum = {features = ["http1", "json", "query", "tokio", "tracing"], optional = true, workspace = true}
chrono = {features = ["serde"], optional = true, workspace = true}
diesel = {features = ["chrono", "postgres", "returning_clauses_for_sqlite_3_35", "sqlite"], optional = true, workspace = true}
diesel_migrations = {optional = true, workspace = true}
futures-util = {optional = true, workspace = true}
http-body-util = {optional = true, workspace = true}
jsonschema = {default-features = false, optional = true, workspace = true}
jsonwebtoken = {optional = true, workspace = true}
mime = {optional = true, workspace = true}
opentelemetry = {optional = true, workspace = true}
opentelemetry-appender-tracing = {optional = true, workspace = true}
opentelemetry-otlp = {optional = true, workspace = true}
opentelemetry_sdk = {optional = true, workspace = true}
reqwest = {default-features = false, features = ["query", "rustls", "stream"], optional = true, workspace = true}
reqwest-middleware = {features = ["query"], optional = true, workspace = true}
reqwest-retry = {default-features = false, optional = true, workspace = true}
serde = {features = ["derive"], optional = true, workspace = true}
serde_json = {optional = true, workspace = true}
serde_urlencoded = {optional = true, workspace = true}
thiserror = {optional = true, workspace = true}
tokio = {features = ["full"], optional = true, workspace = true}
tracing = {optional = true, workspace = true}
tracing-opentelemetry = {optional = true, workspace = true}
tracing-subscriber = {features = ["env-filter"], optional = true, workspace = true}
url = {optional = true, workspace = true}
uuid = {features = ["v7"], optional = true, workspace = true}
webauthn-rs = {optional = true, workspace = true}
xitdb = {optional = true, workspace = true}

[features]
# Storage backends. The concrete backend is chosen at RUNTIME via
# DATABASE_URL (see state.rs), so these are intentionally dependency-free
# markers: dx merges CLI `--features` into the wasm client build, where
# neither the `server` net stack (tokio/mio) nor the storage engines
# (diesel's postgres/sqlite native bindings, xitdb's OS randomness) can
# compile. All storage deps therefore stay bundled in `server`, which the
# wasm build never enables. The `xitdb_backend` module additionally
# requires `server` (see lib.rs) so it vanishes from client builds.
postgres-backend = []
sqlite-backend = []
xitdb-backend = []
server = [
  "dep:argon2",
  "dep:async-trait",
  "dep:axum",
  "dep:chrono",
  "dep:diesel",
  "dep:diesel_migrations",
  "dep:futures-util",
  "dep:http-body-util",
  "dep:jsonschema",
  "dep:jsonwebtoken",
  "dep:mime",
  "dep:opentelemetry",
  "dep:opentelemetry-appender-tracing",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:reqwest",
  "dep:reqwest-middleware",
  "dep:reqwest-retry",
  "dep:serde",
  "dep:serde_json",
  "dep:serde_urlencoded",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-opentelemetry",
  "dep:tracing-subscriber",
  "dep:url",
  "dep:uuid",
  "dep:webauthn-rs",
  "dep:xitdb"
]

[lints]
workspace = true

[package]
edition = "2024"
name = "api"
version = "0.1.0"

[[test]]
name = "api_responses"
required-features = ["server"]

[[test]]
name = "auth"
required-features = ["server"]

[[test]]
name = "concurrency"
required-features = ["server"]

[[test]]
name = "dual_backend"
required-features = ["server"]

[[test]]
name = "http"
required-features = ["server"]

[[test]]
name = "migrations"
required-features = ["server"]

[[test]]
name = "pagination"
required-features = ["server"]

[[test]]
name = "xitdb_backend"
# The module itself requires server (lib.rs gates it on both features).
required-features = ["server", "xitdb-backend"]

