[profiles.default]
# Either backend works; the server picks one from the URL scheme:
# - SQLite:   sqlite://./dev.db (local file, default for development)
# - Postgres: postgresql://postgres@localhost:5433/sample (see scripts/postgres.rs)
DATABASE_URL = {description = "Database connection string (sqlite://./dev.db or postgresql://postgres@localhost:5433/sample)", required = true}
# Observability (used by packages/api/src/telemetry.rs; `development` and
# `dev` profiles inherit these). Values must match the code fallbacks there.
OTEL_EXPORTER_OTLP_ENDPOINT = {default = "http://localhost:4318", description = "OTLP/HTTP receiver for traces, metrics, and logs"}
OTEL_SDK_DISABLED = {default = "false", description = "Set to true to disable telemetry entirely"}
OTEL_SERVICE_NAME = {default = "sample", description = "Service name reported to observability backends"}

[profiles.dev]
DATABASE_URL = {default = "postgresql://postgres@localhost:5433/sample"}

[profiles.development]
DATABASE_URL = {default = "sqlite://./dev.db"}

[project]
name = "sample"
revision = "1.0"
