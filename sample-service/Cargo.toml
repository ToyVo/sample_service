[dependencies]
anyhow = {optional = true, workspace = true}
async-trait = {optional = true, workspace = true}
axum = {features = ["http1", "json", "query", "tokio", "tracing"], optional = true, workspace = true}
chrono = {features = ["serde"], optional = true, workspace = true}
diesel = {features = ["chrono", "postgres", "returning_clauses_for_sqlite_3_35", "sqlite"], optional = true, workspace = true}
dioxus = {features = ["fullstack", "router"], workspace = true}
dioxus-primitives = {default-features = false, workspace = true}
http-body-util = {optional = true, workspace = true}
jsonschema = {default-features = false, optional = true, workspace = true}
mime = {optional = true, workspace = true}
reqwest = {default-features = false, features = ["query", "rustls", "stream"], optional = true, workspace = true}
reqwest-middleware = {features = ["query"], optional = true, workspace = true}
reqwest-retry = {default-features = false, optional = true, workspace = true}
secretspec = {default-features = false, features = ["aac", "age", "akv", "awsps", "awssm", "bw", "bws", "cli", "cloudflare", "ejson", "gcsm", "infisical", "keeper", "keyring", "kubernetes", "openbao", "scaleway", "sops", "vault"], optional = true, workspace = true}
secretspec-derive = {optional = true, workspace = true}
serde = {features = ["derive"], optional = true, workspace = true}
serde_json = {optional = true, workspace = true}
serde_urlencoded = {optional = true, workspace = true}
thiserror = {optional = true, workspace = true}
tokio = {features = ["full"], optional = true, workspace = true}
tracing-subscriber = {features = ["env-filter"], optional = true, workspace = true}
url = {optional = true, workspace = true}
uuid = {features = ["v7"], optional = true, workspace = true}

[features]
default = ["web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = [
  "dep:anyhow",
  "dep:async-trait",
  "dep:axum",
  "dep:chrono",
  "dep:diesel",
  "dep:http-body-util",
  "dep:jsonschema",
  "dep:mime",
  "dep:reqwest",
  "dep:reqwest-middleware",
  "dep:reqwest-retry",
  "dep:secretspec",
  "dep:secretspec-derive",
  "dep:serde",
  "dep:serde_json",
  "dep:serde_urlencoded",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing-subscriber",
  "dep:url",
  "dep:uuid",
  "dioxus/server"
]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]

[lints.clippy]
arithmetic_side_effects = "deny"
as_conversions = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
nursery = {level = "deny", priority = -1}
panic = "deny"
panic_in_result_fn = "deny"
pedantic = {level = "deny", priority = -1}
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[package]
edition = "2024"
name = "sample-service"
version = "0.1.0"
