[profile.android-dev]
inherits = "dev"

[profile.server-dev]
inherits = "dev"

[profile.wasm-dev]
# No DWARF: nightly rustc emits a DWARF version nixpkgs wasm-opt can't parse
# (SIGABRT in DWARFEmitter) — even line tables crash it. dx forces
# `strip=false`, so this `debug=false` is what keeps debug sections out.
# Use `--keep-names` on dx for readable panic names without DWARF.
debug = false
inherits = "dev"
opt-level = 1

[workspace]
members = [
  "packages/api",
  "packages/desktop",
  "packages/mobile",
  "packages/ui",
  "packages/web"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
api = {path = "packages/api"} # workspace
async-trait = "0.1"
axum = "0.8"
chrono = "0.4"
clap = "4.6"
color-eyre = "0.6"
criterion = "0.8"
diesel = "2.2"
diesel_migrations = "2.3"
futures-util = "0.3"
dioxus = "0.7"
dioxus-icons = "0.1"
dioxus-primitives = {git = "https://github.com/DioxusLabs/components", version = "0.0.1"}
http-body-util = "0.1"
itertools = "0.15"
jsonwebtoken = {default-features = false, features = ["rust_crypto"], version = "10"}
jiff = "0.2"
jsonschema = "0.49"
mime = "0.3"
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry_sdk = {features = ["rt-tokio"], version = "0.32"}
rayon = "1.12"
reqwest = "0.13"
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
secretspec = "0.20"
secretspec-derive = "0.20"
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
ui = {path = "packages/ui"} # workspace
url = "2"
uuid = "1"
webauthn-rs = {features = ["danger-allow-state-serialisation"], version = "0.5"}

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
as_conversions = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
nursery = {level = "deny", priority = -1}
panic = "deny"
panic_in_result_fn = "deny"
pedantic = {level = "deny", priority = -1}
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

