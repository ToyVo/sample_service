# Grafana server config (managed by `cgs otel-up`). Filesystem paths come from
# `GF_PATHS_*` env vars set by scripts/otel.rs (absolute, repo-rooted) so this
# file stays portable. Anonymous admin access: no login for local dev.
# UI: http://localhost:3000

[server]
http_port = 3000

[auth.anonymous]
enabled = true
org_role = Admin

[security]
disable_login_form = true
